<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAB5 gyakorló: UML struktúra modellek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f8fb; --grid:#e4eaf2; --card:#ffffff; --ink:#17203a; --graphite:#5a6476;
  --blue:#1d4ed8; --red:#b91c2c; --green:#17784a; --hi:#fff3b0; --line:#cfd8e4;
  --font:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111a27; --grid:#1a2536; --card:#172234; --ink:#e7ecf4; --graphite:#9aa6b8;
    --blue:#82a8ff; --red:#ff8a8a; --green:#62d39c; --hi:#4a4220; --line:#2b3a50;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111a27; --grid:#1a2536; --card:#172234; --ink:#e7ecf4; --graphite:#9aa6b8;
  --blue:#82a8ff; --red:#ff8a8a; --green:#62d39c; --hi:#4a4220; --line:#2b3a50;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background-color:var(--paper); color:var(--ink); font-family:var(--font);
  font-size:17px; line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
a{color:var(--blue)}
.wrap{display:grid; grid-template-columns:260px minmax(0,1fr); gap:32px; max-width:1180px; margin:0 auto; padding:28px 20px 60px}
nav{position:sticky; top:calc(16px + env(safe-area-inset-top,0px)); align-self:start}
nav ol{list-style:none; margin:0; padding:0; counter-reset:ch}
nav li{counter-increment:ch}
nav a{display:flex; gap:10px; align-items:baseline; padding:7px 10px; border-radius:6px; text-decoration:none; color:var(--ink); font-size:15px; line-height:1.3}
nav a::before{content:counter(ch); color:var(--graphite); font-size:13px; min-width:16px}
nav a:hover{background:var(--card)}
nav a[aria-current="page"]{background:var(--card); box-shadow:inset 3px 0 0 var(--blue)}
nav .cnt{margin-left:auto; font-size:12px; color:var(--graphite); white-space:nowrap}
nav .cnt.done{color:var(--green); font-weight:700}
nav .tools{margin-top:14px; padding-left:10px}
button{font:inherit}
.linkbtn{background:none; border:none; color:var(--graphite); text-decoration:underline; cursor:pointer; padding:0; font-size:14px}
main{max-width:780px; min-width:0}
.hero{background:var(--card); border:1.6px solid var(--ink); margin:0 0 28px; max-width:560px}
.hero .hd{border-bottom:1.6px solid var(--ink); padding:12px 18px 14px; text-align:center}
.hero .stp{color:var(--graphite); font-size:14px}
.hero h1{margin:2px 0 0; font-size:30px; line-height:1.15; letter-spacing:-0.01em}
.hero .cmp{padding:10px 18px; font-family:var(--mono); font-size:14px; line-height:1.7}
.hero .cmp + .cmp{border-top:1.6px solid var(--ink)}
h2{font-size:26px; line-height:1.2; margin:0 0 14px}
h3{font-size:19px; margin:28px 0 8px}
p{margin:0 0 12px}
ul.tight{margin:0 0 12px; padding-left:22px}
ul.tight li{margin:3px 0}
.fig{background:var(--card); border:1px solid var(--line); border-radius:4px; padding:10px; margin:10px 0 16px; overflow-x:auto}
.fig .cap{font-size:14px; color:var(--graphite); margin-top:6px}
.dg{display:block; width:100%; height:auto; min-width:520px}
.dg.sm{min-width:0}
.dg .bx{fill:var(--card); stroke:var(--ink); stroke-width:1.4}
.dg .ln{stroke:var(--ink); stroke-width:1.4; fill:none}
.dg .ds{stroke-dasharray:6 4}
.dg text{fill:var(--ink); font-family:var(--font); font-size:13px}
.dg .nm{font-weight:700}
.dg .it{font-style:italic}
.dg .ul{text-decoration:underline}
.dg .st{font-size:11px; fill:var(--graphite)}
.dg .ml{fill:var(--blue); font-weight:700}
.dg .nt{fill:var(--graphite); font-size:12px}
.dg .ml.hl{fill:var(--red); font-size:17px}
.dg .dot{fill:var(--ink)}
.trap{border-left:4px solid var(--red); background:var(--card); padding:10px 14px; margin:14px 0; border-radius:0 4px 4px 0}
.trap b:first-child{color:var(--red)}
.key{border-left:4px solid var(--blue); background:var(--card); padding:10px 14px; margin:14px 0; border-radius:0 4px 4px 0}
code,.mono{font-family:var(--mono); font-size:.9em}
pre{background:var(--card); border:1px solid var(--line); border-radius:4px; padding:12px 14px; overflow-x:auto; font-family:var(--mono); font-size:13.5px; line-height:1.5; margin:10px 0 16px}
table{border-collapse:collapse; width:100%; font-size:15px; margin:8px 0 16px; background:var(--card)}
.tablewrap{overflow-x:auto}
th,td{border:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top}
th{font-weight:700}
.toks{font-family:var(--mono); font-size:15px; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:12px; display:flex; flex-wrap:wrap; gap:4px; align-items:center}
.tok{border:1px dashed var(--graphite); background:transparent; color:var(--ink); padding:3px 7px; border-radius:4px; cursor:pointer; font-family:var(--mono); font-size:15px}
.tok[aria-pressed="true"]{border-style:solid; border-color:var(--blue); background:var(--hi)}
.tokexp{min-height:48px; margin:8px 0 16px; padding:8px 12px; background:var(--card); border-left:4px solid var(--blue); font-size:15px}
.btnrow{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0}
.btn{background:var(--ink); color:var(--paper); border:none; border-radius:6px; padding:8px 14px; cursor:pointer; font-weight:700; font-size:15px}
.btn.ghost{background:transparent; color:var(--ink); border:1.4px solid var(--ink)}
.btn:focus-visible,.tok:focus-visible,.opt input:focus-visible+span,nav a:focus-visible,.linkbtn:focus-visible{outline:3px solid var(--blue); outline-offset:2px}
.quiz{margin-top:34px}
.quiz > h3{margin-top:0}
.q{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:16px 16px 14px; margin:0 0 18px}
.q .qn{font-size:13px; color:var(--graphite); margin-bottom:4px}
.q .qt{font-weight:700; margin-bottom:8px}
.q .hint{font-size:14px; color:var(--graphite); margin:-4px 0 8px}
.stmts{margin:4px 0 12px; padding:0; list-style:none}
.stmts li{padding:8px 12px; border:1px solid var(--line); border-radius:4px; margin-bottom:6px}
.stmts li b{color:var(--blue)}
.stmts .mert{text-align:center; font-weight:700; color:var(--graphite); border:none; padding:0; margin:2px 0 6px}
.opt{display:flex; gap:10px; align-items:flex-start; padding:7px 10px; border:1.4px solid var(--line); border-radius:6px; margin-bottom:6px; cursor:pointer}
.opt input{margin-top:5px; accent-color:var(--blue)}
.opt.ok{border-color:var(--green); background:color-mix(in srgb,var(--green) 10%,transparent)}
.opt.bad{border-color:var(--red); background:color-mix(in srgb,var(--red) 10%,transparent)}
.opt.miss{border-color:var(--green); border-style:dashed}
.opt .tag{margin-left:auto; font-size:13px; font-weight:700; white-space:nowrap; padding-left:8px}
.opt.ok .tag{color:var(--green)} .opt.bad .tag,.opt.miss .tag{color:var(--red)}
.opt.miss .tag{color:var(--green)}
.fb{margin-top:10px; padding:10px 12px; border-radius:4px; display:none; font-size:15.5px}
.fb.show{display:block}
.fb.good{background:color-mix(in srgb,var(--green) 12%,transparent)}
.fb.wrong{background:color-mix(in srgb,var(--red) 12%,transparent)}
.fb .res{font-weight:700}
.pager{display:flex; justify-content:space-between; gap:12px; margin-top:34px; flex-wrap:wrap}
.drill{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:16px}
.drill .score{font-size:15px; color:var(--graphite); margin-bottom:8px}
.drill .sym{border:1px solid var(--line); border-radius:4px; margin-bottom:12px; padding:8px; background:var(--paper)}
.drill .grid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.drill .ch{border:1.4px solid var(--line); background:var(--card); color:var(--ink); border-radius:6px; padding:10px; cursor:pointer; text-align:left; font-size:15px}
.drill .ch.ok{border-color:var(--green); background:color-mix(in srgb,var(--green) 12%,transparent)}
.drill .ch.bad{border-color:var(--red); background:color-mix(in srgb,var(--red) 12%,transparent)}
.drill .ex{margin-top:10px; font-size:15px; min-height:24px}
.cheat td:first-child{width:210px; min-width:170px}
.cheat td:first-child svg{max-width:200px}
details.walk{margin-top:12px; border-top:1px dashed var(--line); padding-top:10px}
details.walk summary{cursor:pointer; font-weight:700; color:var(--blue)}
details.walk ol{margin:8px 0 0; padding-left:22px}
details.walk li{margin:5px 0}
.optlist{margin:4px 0 0; padding-left:22px}
.optlist li{margin:3px 0}
.spec{background:var(--card); border:1px solid var(--line); border-left:4px solid var(--graphite); padding:10px 14px; margin:10px 0 16px; border-radius:0 4px 4px 0}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr; gap:14px; padding-top:16px}
  nav{position:static}
  nav ol{display:flex; overflow-x:auto; gap:4px; padding-bottom:6px}
  nav li{flex:0 0 auto}
  nav a{white-space:nowrap}
  .hero h1{font-size:24px}
  .drill .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){
  .fb.show{animation:fbin .18s ease-out}
  @keyframes fbin{from{opacity:0; transform:translateY(-3px)}to{opacity:1; transform:none}}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="mOpen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11" style="fill:none;stroke:var(--ink);stroke-width:1.4"/></marker>
    <marker id="mTri" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L15,8 L1,15 Z" style="fill:var(--card);stroke:var(--ink);stroke-width:1.4"/></marker>
    <marker id="mDF" viewBox="0 0 20 12" refX="19" refY="6" markerWidth="20" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,6 L10,1 L19,6 L10,11 Z" style="fill:var(--ink);stroke:var(--ink);stroke-width:1.2"/></marker>
    <marker id="mDH" viewBox="0 0 20 12" refX="19" refY="6" markerWidth="20" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,6 L10,1 L19,6 L10,11 Z" style="fill:var(--card);stroke:var(--ink);stroke-width:1.2"/></marker>
  </defs>
</svg>

<div class="wrap">
  <nav aria-label="Fejezetek">
    <ol id="navlist"></ol>
    <div class="tools"><button class="linkbtn" id="reset">Haladás törlése</button></div>
  </nav>
  <main>
    <header class="hero" aria-label="LAB5 gyakorló">
      <div class="hd"><div class="stp">«gyakorló»</div><h1>UML struktúra modellek</h1></div>
      <div class="cmp">+ beugró(diagram) : 4 kérdés<br>+ kiugró(szöveg, modell, kód) : 85%</div>
      <div class="cmp">Szoftvertechnológia, LAB5</div>
    </header>
    <article id="content"></article>
  </main>
</div>

<script>
(function(){
"use strict";

/* ---------- SVG helpers ---------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function svg(w,h,body,cls){return `<svg class="dg${cls?' '+cls:''}" viewBox="0 0 ${w} ${h}" role="img">${body}</svg>`;}
function B(x,y,w,name,attrs,o){
  attrs=attrs||[]; o=o||{};
  const head=26+(o.st?14:0);
  const body=attrs.length? attrs.length*17+8 : (o.nb?0:10);
  const h=head+body;
  let s=`<rect class="bx" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
  let ty=y+18;
  if(o.st){s+=`<text class="st" x="${x+w/2}" y="${y+15}" text-anchor="middle">«${esc(o.st)}»</text>`; ty+=13;}
  s+=`<text class="nm${o.it?' it':''}${o.ul?' ul':''}" x="${x+w/2}" y="${ty}" text-anchor="middle">${esc(name)}</text>`;
  if(!o.nb) s+=`<line class="ln" x1="${x}" y1="${y+head}" x2="${x+w}" y2="${y+head}"/>`;
  attrs.forEach((a,i)=>{
    const u=a.charAt(0)==="_";
    s+=`<text class="${u?'ul':''}" x="${x+8}" y="${y+head+16+i*17}">${esc(u?a.slice(1):a)}</text>`;
  });
  return s;
}
function L(x1,y1,x2,y2,o){
  o=o||{};
  return `<line class="ln${o.d?' ds':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"${o.e?` marker-end="url(#${o.e})"`:''}${o.s?` marker-start="url(#${o.s})"`:''}/>`;
}
function P(d,o){o=o||{};return `<path class="ln${o.d?' ds':''}" d="${d}"${o.e?` marker-end="url(#${o.e})"`:''}/>`;}
function T(x,y,t,o){
  o=o||{};
  return `<text${o.id?` id="${o.id}"`:''} class="${o.c||''}" x="${x}" y="${y}"${o.a?` text-anchor="${o.a}"`:''}>${esc(t)}</text>`;
}
function M(x,y,t,id,a){return T(x,y,t,{c:'ml',id:id,a:a});}
function X(x,y){return `<line class="ln" x1="${x-5}" y1="${y-5}" x2="${x+5}" y2="${y+5}"/><line class="ln" x1="${x-5}" y1="${y+5}" x2="${x+5}" y2="${y-5}"/>`;}
function COMP(x,y,w,h,name){
  const ix=x+w-26, iy=y+8;
  return `<rect class="bx" x="${x}" y="${y}" width="${w}" height="${h}"/>`+
    `<rect class="bx" x="${ix}" y="${iy}" width="16" height="18"/><rect class="bx" x="${ix-4}" y="${iy+4}" width="8" height="4"/><rect class="bx" x="${ix-4}" y="${iy+11}" width="8" height="4"/>`+
    `<text class="st" x="${x+w/2}" y="${y+h/2-6}" text-anchor="middle">«component»</text>`+
    `<text class="nm" x="${x+w/2}" y="${y+h/2+12}" text-anchor="middle">${esc(name)}</text>`;
}
function BALL(cx,cy){return `<circle class="bx" cx="${cx}" cy="${cy}" r="8"/>`;}
function SOCK(cx,cy,openLeft){return `<path class="ln" d="M${cx},${cy-12} A12,12 0 0 ${openLeft?1:0} ${cx},${cy+12}"/>`;}
function PORT(cx,cy){return `<rect class="bx" x="${cx-7}" y="${cy-7}" width="14" height="14"/>`;}
function fig(s,cap){return `<div class="fig">${s}${cap?`<div class="cap">${cap}</div>`:''}</div>`;}

/* ---------- Shared diagrams ---------- */
const libDiagram = svg(720,400,
  B(30,20,190,"Szemely",["nev : String"],{it:true})+
  B(30,160,190,"Tag",["/aktivKolcsonzes : Integer"])+
  L(125,160,125,71,{e:"mTri"})+
  B(500,20,170,"Konyvtar",["nev : String"])+
  B(500,160,170,"Peldany",["leltariSzam : String"])+
  B(500,310,170,"Konyv",["cim : String","isbn : String"])+
  L(585,71,585,160,{s:"mDF"})+ M(595,92,"1")+ M(595,152,"0..*")+
  L(585,211,585,310,{e:"mOpen"})+ X(585,223)+ M(595,240,"1..*")+ M(595,302,"1")+
  L(220,185,500,185)+ M(228,178,"0..1")+ M(492,178,"0..5","", "end")+
  L(360,185,360,262,{d:true})+
  B(285,262,150,"Kolcsonzes",["hatarido : Date"])
);

const rendDiagram = svg(700,130,
  B(40,30,200,"Rendeles",["datum : Date"])+
  B(440,30,200,"Tetel",["mennyiseg : Integer"])+
  L(240,57,440,57,{s:"mDF",e:"mOpen"})+ M(254,50,"1")+ M(432,50,"1..*","","end")+
  T(440,108,"{mennyiseg > 0}",{c:'nt'})
);

/* ---------- Relációanalízis options ---------- */
const REL=[
  "<b>A (+ −):</b> A következtetés első fele igaz, a második fele hamis.",
  "<b>B (− +):</b> A következtetés első fele hamis, a második fele igaz.",
  "<b>C (+ + −):</b> A következtetés mindkét fele igaz, de a következtetés maga hamis.",
  "<b>D (+ + +):</b> A következtetés mindkét fele igaz, és a következtetés is igaz.",
  "<b>E (− −):</b> A következtetés mindkét fele hamis."
];

/* ---------- Chapters ---------- */
const CH=[];

CH.push({id:"bevezeto", title:"Így használd", html:`
<h2>Így használd</h2>
<p>Ez a gyakorló a LAB5 beugrójára és kiugrójára készít fel. A fejezetek sorban követik a 11. előadás anyagát: komponensek, osztályok, asszociációk, navigálhatóság, példánymodellek, a további jelölések, végül a modell és a kód kapcsolata. Minden fejezet végén ellenőrző kérdések vannak, az utolsó két fejezet pedig próba beugró és próba kiugró.</p>
<div class="key"><b>A számonkérés formája.</b> A beugróban 4 kérdés vonatkozik ugyanarra a diagramra, feleletválasztós, all-or-nothing és relációanalízis típusban. A kiugró 2 feladatból áll, feladatonként 4 alkérdéssel. Az egyik összetett: szöveges leírást, modellt és kódot kell összevetni. 85% kell, és 3 próbálkozásod van.</div>
<h3>A relációanalízis</h3>
<p>Két állítást kapsz, köztük egy „mert” szóval. Először mindkettőről külön döntsd el, hogy igaz-e. Csak ha mindkettő igaz, akkor jön a második kérdés: tényleg a második állítás <i>indokolja</i> az elsőt? A válaszlehetőségek:</p>
<ul class="tight">${REL.map(r=>`<li>${r}</li>`).join("")}</ul>
<div class="trap"><b>Tipikus csapda:</b> mindkét állítás igaz, és ugyanarról a diagramrészletről szól, mégsem a második magyarázza az elsőt. Ilyenkor C a jó válasz, nem D.</div>
<div class="trap"><b>Figyelj a kötőszóra:</b> a kiugróban „ezért” is előfordul. „X; mert Y” esetén Y az ok, „X; ezért Y” esetén X az ok és Y a következmény. Mindkét esetben azt kell eldönteni, hogy tényleg az okból következik-e a másik.</div>
<p>Ezek a betűjelek és szövegek megegyeznek az éles beugróéval. A + igazat, a − hamisat jelent. C-nél és D-nél a harmadik jel magáról a „mert” kapcsolatról szól.</p>
<h3>All-or-nothing kérdések</h3>
<p>Ezeknél minden jó választ be kell jelölni, rosszat egyet sem. Itt is így pontozunk: a kérdés csak akkor számít helyesnek, ha a teljes kijelölés pontos.</p>
<p>A haladásodat a böngésző megjegyzi, a bal oldali listában látod, hány kérdést oldottál már meg helyesen.</p>
`, quiz:[]});

CH.push({id:"komponensek", title:"Komponensek", html:`
<h2>Komponensmodellek</h2>
<p>A komponens a rendszer moduláris, <b>cserélhető</b> része. A belseje rejtett, a környezetével csak jól definiált interfészeken keresztül érintkezik. Ha egy másik komponens ugyanazokat az interfészeket biztosítja és várja el, a helyére tehető.</p>
<h3>Függőség (dependency)</h3>
${fig(svg(700,120, COMP(40,25,200,70,"OrderService")+COMP(460,25,200,70,"EmailNotifier")+L(240,60,460,60,{d:true,e:"mOpen"})+T(350,50,"«use»",{c:'st',a:'middle'})),
 "Szaggatott vonal, nyitott nyílhegy. A nyíl a <b>szállító</b> (supplier) felé mutat: az OrderService függ az EmailNotifier-től, annak változása kihathat rá.")}
<p>A függőség a leglazább kapcsolat: csak annyit mond, hogy a kliens szemantikája nem teljes a szállító nélkül. Hogy pontosan mitől függ, az itt még nincs megadva.</p>
<h3>Biztosított és elvárt interfész</h3>
${fig(svg(700,120, COMP(250,25,200,70,"Rendszer")+L(250,60,170,60)+BALL(162,60)+T(162,90,"IRendeles",{a:'middle'})+L(450,60,530,60)+SOCK(542,60,false)+T(542,90,"INotifier",{a:'middle'})),

<h2>Példánymodellek (objektumdiagram)</h2>

<div class="trap"><b>Csapda:</b> egy <b>hiányzó</b> slot nem hiba. A példányleírás lehet részleges, nem kell minden attribútum értékét megadni. Egy <b>idegen</b> slot viszont hiba. A hiányzó <b>link</b> viszont hiba, ha egy multiplicitás alsó határa miatt kötelező lenne.</div>

<p>A példánymodell rajzolása arra is jó, hogy egy osztálymodellt megérts, és kérdéseket fogalmazz meg vele kapcsolatban. Ez a kiválóan megfelelt feladatoknál is hasznos lesz.</p>

CH.push({id:"tovabbi-elemek", title:"További elemek", html:`
<h2>Műveletek és további jelölések</h2>
<h3>Művelet és paraméter</h3>
<p><code>+ leadRendeles(in r : Rendeles, out azon : Integer) : Boolean</code></p>
<ul class="tight">
 <li>Szintaxis: <code>[láthatóság] név(paraméterlista) : visszatérési típus [multiplicitás] {módosítók}</code>.</li>
 <li>Paraméterirány: <code>in</code>, <code>out</code>, <code>inout</code>, <code>return</code>. A paraméternek is lehet multiplicitása, a 0 alsó határ opcionális paramétert jelent.</li>
 <li>Az <b>aláhúzott</b> művelet vagy attribútum statikus, a dőlt betűs művelet absztrakt.</li>
 <li>A műveletet (Operation) megvalósító viselkedés a metódus. Egy művelethez több metódus is tartozhat, így modellezhető a polimorfizmus.</li>
</ul>
<h3>Jelölések egy táblában</h3>
<div class="tablewrap"><table>
<tr><th>Jelölés</th><th>Jelentés</th></tr>
<tr><td><code>+ - # ~</code></td><td>public, private, protected, package láthatóság. Jelentésük eltérhet egy-egy programozási nyelvétől.</td></tr>
<tr><td><code>/osszeg</code></td><td>Származtatott tulajdonság, az értéke számított.</td></tr>
<tr><td>aláhúzás</td><td>Statikus tag (osztályszintű), illetve példánymodellben a példány neve.</td></tr>
<tr><td>dőlt név vagy <code>{abstract}</code></td><td>Absztrakt osztály vagy művelet.</td></tr>
<tr><td><code>{meret &gt;= 0}</code></td><td>Kényszer (constraint): olyan feltétel, amelyet multiplicitással nem tudunk kifejezni. Kapcsos zárójelben vagy jegyzetben.</td></tr>

CH.push({id:"modell-es-kod", title:"Modellből kód", html:`
<h2>A modell és a kód kapcsolata</h2>
<p>A kiugró összetett feladatában szöveget, modellt és kódot kell összevetni. Ehhez tudnod kell, hogy az egyes modellelemek tipikusan minek felelnek meg a kódban, és mi <b>nem</b> következik a modellből.</p>
${fig(svg(700,100, B(60,25,150,"Maze",[],{nb:true})+B(490,25,150,"Field",[],{nb:true})+L(210,38,490,38,{s:"mOpen",e:"mOpen"})+M(222,31,"1")+M(480,31,"1..*","","end")),"Mindkét irányban navigálható: a labirintus mezőkből áll, egy mező pontosan egy labirintushoz tartozik.")}
<pre>public class Maze {
    private final List&lt;Field&gt; fields = new ArrayList&lt;&gt;();   // 1..* vég → kollekció
    void addField(Field f) { fields.add(f); }
}

public class Field {
    private final Maze maze;                               // 1 vég → egyetlen referencia
    public Field(Maze maze) {
        this.maze = maze;
        maze.addField(this);
    }
}</pre>
<div class="tablewrap"><table>
<tr><th>Modellelem</th><th>Tipikus megfelelő a kódban</th></tr>
<tr><td>navigálható vég, felső határ 1</td><td>egy referencia típusú mező</td></tr>
<tr><td>navigálható vég, felső határ &gt; 1</td><td>kollekció (List, Set). Hogy melyik, az implementációs döntés.</td></tr>
<tr><td>nem navigálható vagy nem specifikált vég</td><td>nem kötelező, hogy legyen mező. Ha a modell nem specifikálja, a mező léte vagy hiánya sem ellentmondás.</td></tr>
<tr><td>alsó határ ≥ 1</td><td>a kódnak biztosítania kell, például a konstruktorban kéri az elemet</td></tr>
<tr><td>kompozíció</td><td>az egész felel a részek életciklusáért, egy rész nem kerülhet két egészhez</td></tr>
<tr><td>általánosítás / interfész-megvalósítás</td><td><code>extends</code> / <code>implements</code></td></tr>
<tr><td>enumeráció</td><td><code>enum</code></td></tr>
<tr><td>asszociációs osztály</td><td>külön osztály, amely mindkét résztvevőre hivatkozik</td></tr>
</table></div>
<div class="key"><b>Gondolkodási sorrend az összetett feladatnál:</b> 1) mit követel a szöveg, 2) ebből mit fejez ki a modell (multiplicitás, navigálhatóság, kompozíció, kényszer), 3) a kód betartja-e a modellt, vagy csak nem mond neki ellent. Az „ellentmond” és a „nem kényszeríti ki” két külön dolog.</div>

function mini(s){return svg(200,40,s,"sm");}
CH.push({id:"osszefoglalo", title:"Összefoglaló (puska)", html:`
<h2>Összefoglaló: a legfontosabb dolgok</h2>
<p>Ez a fejezet az egész anyag tömör vázlata. A beugró és a kiugró előtt ezt érdemes átfutni. A fejezet végén néhány kérdés a ritkábban előkerülő témákról is van.</p>

<h3>Vonalak és végek</h3>
<div class="tablewrap"><table class="cheat">
<tr><th>Jelölés</th><th>Jelentés</th></tr>
<tr><td>${mini(L(10,24,185,24,{e:"mTri"}))}</td><td><b>Általánosítás.</b> Folytonos vonal, üres háromszög a szülőnél. A gyerek példánya a szülő példánya is.</td></tr>
<tr><td>${mini(L(10,24,185,24,{d:true,e:"mTri"}))}</td><td><b>Interfész-megvalósítás.</b> Szaggatott vonal, üres háromszög az interfésznél. A megvalósítónak az interfész minden műveletét meg kell valósítania.</td></tr>
<tr><td>${mini(L(10,24,185,24,{d:true,e:"mOpen"})+T(97,16,"«use»",{c:'st',a:'middle'}))}</td><td><b>Függőség.</b> A nyíl a szállító felé mutat. Fajtái: «use» (használat), «instantiate» (példányosítás), realizáció, absztrakció.</td></tr>
<tr><td>${mini(L(10,24,185,24,{e:"mOpen"}))}</td><td><b>Navigálható vég.</b> A nyíl irányába hatékonyan elérhetők a példányok. Nem olvasási irány.</td></tr>
<tr><td>${mini(L(10,24,185,24)+X(172,24))}</td><td><b>Nem navigálható vég.</b> Az elérés nem garantáltan hatékony, de nem feltétlenül lehetetlen.</td></tr>
<tr><td>${mini(L(10,24,185,24))}</td><td><b>Jelöletlen vég:</b> a navigálhatóság nem specifikált.</td></tr>
<tr><td>${mini(L(10,24,185,24,{s:"mDF"}))}</td><td><b>Kompozíció.</b> Teli rombusz az egész oldalán. Egy rész csak egy egészhez tartozhat, és vele együtt törlődik.</td></tr>
<tr><td>${mini(L(10,24,185,24,{s:"mDH"}))}</td><td><b>Megosztott aggregáció.</b> Üres rombusz a csoportosító oldalán. Egy elem több csoportban is lehet.</td></tr>
<tr><td>${mini(L(10,24,185,24)+`<circle class="dot" cx="179" cy="24" r="4"/>`)}</td><td><b>Vég birtoklása.</b> A pontos véget a <i>túloldali</i> osztály birtokolja (és így az a vég navigálható).</td></tr>
<tr><td>${mini(L(10,12,185,12)+L(97,12,97,36,{d:true}))}</td><td><b>Asszociációs osztály.</b> A kapcsolathoz tartozó adat. Egy példánya pontosan egy linkhez tartozik.</td></tr>
<tr><td>${mini(L(10,22,60,22)+BALL(68,22)+L(120,22,150,22)+SOCK(162,22,false))}</td><td><b>Nyalóka:</b> biztosított interfész. <b>Foglalat:</b> elvárt interfész.</td></tr>
<tr><td>${mini(`<rect class="bx" x="60" y="4" width="130" height="32"/>`+PORT(60,20))}</td><td><b>Port:</b> kis négyzet a komponens határán, nevével ellátott kapcsolódási pont. Több interfésze is lehet.</td></tr>
</table></div>

<h3>Komponensek</h3>
<ul class="tight">
 <li>A komponens cserélhető, a belseje rejtett, csak interfészeken keresztül érintkezik a környezetével. Ez adja a laza csatolást.</li>
 <li>Belső felépítésben a <code>név : Típus [multiplicitás]</code> elem <b>szerep</b> (part), nem típus. A <code>:LoanManager</code> egy névtelen, LoanManager típusú rész.</li>
 <li><b>Delegáció:</b> külső port és belső rész között, az irány nem fordulhat meg (biztosított befelé biztosított, elvárt kifelé elvárt). <b>Assembly:</b> két belső rész között. Mindkettő csak belső felépítésben.</li>
 <li>Külső komponens és egy port interfésze között szaggatott «use» nyíl: használati függőség.</li>
 <li>Hogy ki biztosít és ki vár el, azt a gömb és a félkör helye dönti el, nem az, hogy ki használja a másikat.</li>
</ul>

<h3>Multiplicitás</h3>
<ul class="tight">
 <li>Egy példányhoz tartozó társak számát a <b>távolabbi</b> vég adja meg.</li>
 <li><code>*</code> = <code>0..*</code>, <code>1..*</code> = legalább egy (nem „több kell”), <code>0..1</code> = opcionális.</li>
 <li>Ha nincs feltüntetve, a diagramból semmire nem következtethetünk.</li>
 <li>A korlát példányonként értendő, és a leszármazottak példányai is beleszámítanak az ős asszociációjába.</li>
</ul>

<h3>Osztályok és tulajdonságok</h3>
<ul class="tight">
 <li>Tulajdonság: <code>[láthatóság] [/] név [: típus] [[mult.]] [= default] [{módosítók}]</code>. Művelet: <code>[láthatóság] név(paraméterek) : visszatérési típus</code>, paraméterirány in, out, inout, return.</li>
 <li><code>+</code> public, <code>-</code> private, <code>#</code> protected, <code>~</code> package. <code>/</code> származtatott, aláhúzás statikus, dőlt név absztrakt.</li>
 <li>Módosítók: <code>{readOnly}</code>, <code>{ordered}</code>, <code>{unique}</code>, <code>{id}</code>, <code>{redefines x}</code>. Asszociációvégeken is használhatók.</li>
 <li>Beépített típusok (Integer, Real, Boolean, String, UnlimitedNatural): matematikai fogalmak, nincs bitméretük.</li>
 <li>DataType: példányai csak értékükben különböznek. Enumeration: literálokból álló DataType. Constraint: <code>{ }</code> közötti feltétel.</li>
 <li>Az általánosításban a leszármazott bővíthet vagy ellentmondásmentesen felüldefiniálhat (pl. szűkítheti a multiplicitást). Többszörös általánosítás is megengedett.</li>
</ul>

<h3>Asszociációk</h3>
<ul class="tight">
 <li>Tartós kapcsolat, a példánya a link. Az attribútum és az asszociáció lényegében ugyanazt fejezi ki. Asszociáció mellé nem kell List attribútum.</li>
 <li>Kompozíció és aggregáció: csak bináris asszociáción, csak az egyik végen, kör nélkül.</li>
 <li>Végnevek akkor kellenek, ha több asszociáció van ugyanazon osztályok között. Többes asszociáció: rombusz középen, három vagy több résztvevővel.</li>
</ul>

<h3>Példánymodell</h3>
<ul class="tight">
 <li>Aláhúzott <code>név : Típus</code>, mindkettő elhagyható. A link sima vonal, kompozíciónál is.</li>
 <li>Érvényesség: csak a típusban (vagy őseiben) lévő slot, csak asszociációval összekötött osztályok példányai között link, a multiplicitások minimuma és maximuma betartva, a típusok kényszerei teljesülnek.</li>
 <li>Kvízben a hiányzó slot nem hiba (a leírás részleges lehet), az idegen slot hiba. A hiányzó link akkor hiba, ha az alsó határ megkövetelné. Saját rajznál minden (örökölt) attribútumhoz írj slotot.</li>
 <li>Absztrakt osztálynak nincs közvetlen példánya, a leszármazottjénak van.</li>
</ul>

<h3>Összevetés (kiugró)</h3>
<ul class="tight">
 <li>Megvalósítás az osztálydiagramon = biztosított interfész (gömb) a komponensdiagramon. «use» = elvárt interfész (félkör).</li>
 <li>A delegációnak ahhoz a részhez kell vezetnie, amelynek osztálya megvalósítja vagy használja az interfészt.</li>
 <li>A kompozíció tulajdonosa az, akit a leírás szerint a részek nem élnek túl („létrehozza és nyilvántartja”).</li>
 <li>Ami a leírásban „különálló komponens”, az nem lehet belső rész.</li>
 <li>Kódnál különítsd el: a kód <i>ellentmond</i> a modellnek, vagy csak <i>nem kényszeríti ki</i>.</li>
 <li>Kódból komponensdiagram: <code>implements X</code> → biztosított interfész (nyalóka), egy <code>X</code> típusú mező → elvárt interfész (foglalat).</li>
 <li>„Mely komponenseket kell megváltoztatni, ha az X interfész új verziója jön?” Mindenkit, aki biztosítja vagy használja, és azt a befoglaló komponenst is, amelyik a portján keresztül kifelé delegálja.</li>
</ul>

<h3>Ellenpélda-példánymodell (kiválóan megfelelt, vizsga)</h3>
<ul class="tight">
 <li>Tipikus feladat: olyan példánymodell, amely megfelel a fogalmi modellnek, de megsért egy új követelményt.</li>
 <li>InstanceSpecification-ök (aláhúzott <code>név : Típus</code>) és linkek, sehol nincs multiplicitás vagy rombusz. Ha egy példányhoz kettő tartozik, mindkettőt külön fel kell rajzolni.</li>
 <li>Minden nem nulla alsó határhoz vedd fel a szükséges példányokat, és minden attribútumhoz legyen slot.</li>
 <li>Legyen minimális: csak annyi elem, amennyi a megsértéshez és a multiplicitásokhoz kell.</li>
 <li>Ha egy követelmény multiplicitással nem fejezhető ki, akkor struktúrával (külön alosztályok, <code>{redefines}</code>, asszociáció a speciális osztályokhoz) vagy kényszerrel lehet.</li>
</ul>

<h3>Relációanalízis menete</h3>
<ul class="tight">
 <li>Először mindkét tagmondatról külön dönts. Ha valamelyik hamis: A, B vagy E, és kész.</li>
 <li>Ha mindkettő igaz: tényleg az ok magyarázza a másikat? Ha igen, D, ha nem, C.</li>
 <li>„mert”: a második az ok. „ezért”: az első az ok.</li>
</ul>

<h3>Ritkábban kérdezett, de az anyag része</h3>
<ul class="tight">
 <li><b>Modell ≠ diagram:</b> a diagram a modell egy nézete, nem minden elem jelenik meg rajta.</li>
 <li><b>Sztereotípia:</b> « » közötti név, az UML elemek kiterjesztése (beépített, pl. «component», «interface», vagy saját, egy profil részeként).</li>
 <li><b>Csomag:</b> modellelemek csoportosítása, mint a névtér.</li>
 <li><b>Minősítő (qualifier):</b> kis téglalap a végen, a túloldali példányokat partíciókra osztja. <b>Beágyazott osztály</b> is létezik.</li>
 <li>Általánosítás asszociációk között, függőség osztályok között is használható.</li>
 <li><b>Signal és Reception:</b> aszinkron kommunikáció, a küldő nem vár válaszra.</li>
 <li>Egy művelethez több metódus is tartozhat: így modellezhető a polimorfizmus.</li>
 <li>Interfésznek lehet attribútuma, és interfészek között asszociáció is lehet, de ezekkel óvatosan.</li>
 <li><b>Dekompozíció:</b> fizikai (milyen alkatrész) vagy logikai (mit csinál). <b>Részletességi szintek:</b> fogalmi modell, kezdeti analízis, részletes implementáció.</li>
 <li>Az UML „generalization”-nek hívja, nem „inheritance”-nek, mert nem kötődik programozási nyelvhez.</li>
</ul>
`, quiz:[

CH.push({id:"kidolgozott-beugro", title:"Kidolgozott beugró", html:`
<h2>Kidolgozott beugró</h2>
<p>A példatár CubeSat feladatának (4.2.1) modelljére épül, beugró formában: egy diagram, négy kérdés. Előbb próbáld meg magad, a „Megoldás menete” részt csak utána nyisd ki.</p>
<div class="key"><b>Módszer minden kérdésnél.</b> 1) Mit kérdez pontosan: melyik két osztály, melyik irányból? 2) Keresd meg a diagramon az érintett vonalat vagy elemet. 3) Olvasd le a jelölést: szám a <b>túloldalon</b>, teli vagy üres rombusz, nyíl vagy X, háromszög, dőlt név. 4) Nézd meg az öröklést: a leszármazott megkapja az ős kapcsolatait. 5) Csak ezután dönts.</div>
${fig(cubeDiagram)}

<div class="q"><div class="qn">1. kérdés, relációanalízis</div>
<ul class="stmts"><li><b>1.</b> Ha egy műholdat törlünk, a szenzorai is törlődnek.</li><li class="mert">mert</li><li><b>2.</b> A Satellite és a Sensor között aggregáció van.</li></ul>
<details class="walk"><summary>Megoldás menete</summary><ol>
<li><b>Első fele.</b> Keresd meg a Satellite–Sensor vonalat. A Satellite oldalán <b>üres</b> rombusz van: megosztott aggregáció. Együtt törlődés csak kompozíciónál (teli rombusz) következik. (A példatár szövege is kimondja, hogy a szenzorok megmaradnak.) Ezért az első fele <b>hamis</b>.</li>
<li><b>Második fele.</b> Az üres rombusz is aggregáció, csak megosztott. Ezért <b>igaz</b>.</li>
<li><b>Döntés.</b> Első hamis, második igaz: <b>B (− +)</b>. A „mert”-et itt már nem kell vizsgálni.</li>
<li><b>Csapda:</b> az „aggregáció” szót sokan kompozíciónak olvassák. Mindig nézd meg, teli vagy üres a rombusz.</li>
</ol></details></div>

<div class="q"><div class="qn">2. kérdés, all-or-nothing</div>
<div class="qt">Melyik állítások igazak?</div>
<ol class="optlist" type="a">
<li>Egy CubeSat példányhoz 1 vagy 2 CommSubsystem tartozik.</li>
<li>Egy Satellite példányból hatékonyan elérhetők a szenzorai.</li>
<li>Egy szenzor legfeljebb egy műholdhoz tartozhat.</li>
<li>Az Antenna osztálynak lehet közvetlen példánya.</li>
<li>Minden konstellációban legalább egy műhold van.</li>
</ol>
<details class="walk"><summary>Megoldás menete</summary><ol>
<li><b>a)</b> CubeSat és CommSubsystem között nincs közvetlen vonal. De a CubeSat a Satellite leszármazottja (üres háromszög), így örökli a Satellite–CommSubsystem asszociációt. A CommSubsystem felőli végen 1..2 áll. <b>Igaz.</b></li>
<li><b>b)</b> A Satellite–Sensor vonal Sensor felőli végén nyílhegy van: navigálható. <b>Igaz.</b></li>
<li><b>c)</b> Azt, hogy egy szenzorhoz hány műhold tartozik, a <b>Satellite</b> felőli vég adná meg. Ott nincs szám, ezért erre nem következtethetünk. <b>Nem jelöljük.</b></li>
<li><b>d)</b> Az Antenna neve dőlt: absztrakt, nincs közvetlen példánya. <b>Hamis.</b></li>
<li><b>e)</b> Constellation–Satellite vonal, a Satellite felőli végen 1..*. <b>Igaz.</b></li>
<li><b>Döntés:</b> a, b, e. <b>Csapda:</b> a c) opció. A hiányzó multiplicitás nem jelent 1-et.</li>
</ol></details></div>

<div class="q"><div class="qn">3. kérdés, feleletválasztós</div>
<div class="qt">A modell szerint legfeljebb hány antennája lehet egy műholdnak?</div>
<ol class="optlist" type="a"><li>1</li><li>2</li><li>Korlátlan sok</li><li>A diagramból nem állapítható meg, mert nincs közvetlen kapcsolat</li></ol>
<details class="walk"><summary>Megoldás menete</summary><ol>
<li>Nincs közvetlen Satellite–Antenna vonal, ezért láncban kell gondolkodni.</li>
<li><b>Satellite → CommSubsystem:</b> a túloldali (CommSubsystem felőli) szám 1..2, tehát legfeljebb 2 kommunikációs alrendszer.</li>
<li><b>CommSubsystem → Antenna:</b> a túloldali (Antenna felőli) szám 1, tehát mindegyiknek pontosan egy antennája van.</li>
<li>A kompozíció miatt egy antenna nem tartozhat két alrendszerhez, nem lehet közös. Így legfeljebb 2 · 1 = <b>2</b>, vagyis a <b>b)</b>.</li>
<li><b>Csapda:</b> csak az egyik vonalat nézni („1”), vagy feladni, mert nincs közvetlen vonal.</li>
</ol></details></div>

<div class="q"><div class="qn">4. kérdés, relációanalízis</div>
<ul class="stmts"><li><b>1.</b> Egy CubeSat példány kapcsolódhat CommSubsystem példányhoz.</li><li class="mert">mert</li><li><b>2.</b> A CubeSat a Satellite leszármazottja.</li></ul>
<details class="walk"><summary>Megoldás menete</summary><ol>
<li><b>Első fele.</b> Az a) opciónál láttuk: az öröklés miatt kapcsolódhat. <b>Igaz.</b></li>
<li><b>Második fele.</b> Üres háromszög a Satellite-nál. <b>Igaz.</b></li>
<li><b>A „mert”.</b> Próbáld ki gondolatban: ha a CubeSat nem lenne leszármazott, nem lenne vonal közte és a CommSubsystem között, és nem kapcsolódhatna. Tehát tényleg ez az ok: <b>D (+ + +)</b>.</li>

</ol></details></div>
`, quiz:[]});

/* ---------- Nav ---------- */
function renderNav(current){
  const ol=document.getElementById("navlist");
  ol.innerHTML=CH.map(c=>{
    const n=c.quiz.length, d=c.quiz.filter(q=>solved[q.id]).length;
    const cnt=n?`<span class="cnt${d===n?' done':''}">${d===n?'✓ ':''}${d}/${n}</span>`:'';
    return `<li><a href="#${c.id}"${c.id===current?' aria-current="page"':''}>${c.title}${cnt}</a></li>`;
  }).join("");
}

/* ---------- Quiz ---------- */
function renderQ(q,i){
  const multi=q.type==="multi";
  const opts=q.type==="rel"?REL:q.opts;
  const name="q_"+q.id;
  let h=`<div class="q" data-id="${q.id}"><div class="qn">${i+1}. kérdés${q.type==="rel"?", relációanalízis":multi?", all-or-nothing":""}</div>`;
  if(q.fig) h+=q.fig;
  if(q.type==="rel"){
    h+=`<ul class="stmts"><li><b>1.</b> ${q.s1}</li><li class="mert">${q.conj||"mert"}</li><li><b>2.</b> ${q.s2}</li></ul>`;
  } else {
    h+=`<div class="qt">${q.q}</div>`;
  }
  if(multi) h+=`<div class="hint">Jelöld be az összes igaz állítást.</div>`;
  h+=opts.map((o,k)=>`<label class="opt"><input type="${multi?'checkbox':'radio'}" name="${name}" value="${k}"><span>${o}</span><span class="tag"></span></label>`).join("");
  h+=`<div class="btnrow"><button class="btn chk">Ellenőrzés</button><button class="btn ghost rst">Újra</button></div><div class="fb" aria-live="polite"></div></div>`;
  return h;
}
function bindQ(el,q){
  const fb=el.querySelector(".fb");
  el.querySelector(".chk").addEventListener("click",()=>{
    const sel=[...el.querySelectorAll("input:checked")].map(x=>+x.value);
    if(!sel.length){ fb.className="fb show wrong"; fb.innerHTML="Jelölj meg legalább egy választ."; return; }
    const ans=Array.isArray(q.ans)?q.ans:[q.ans];
    const ok=sel.length===ans.length && sel.every(s=>ans.includes(s));
    el.querySelectorAll(".opt").forEach((lab,k)=>{
      lab.classList.remove("ok","bad","miss");
      const t=lab.querySelector(".tag"); t.textContent="";
      const isA=ans.includes(k), isS=sel.includes(k);
      if(isA&&isS){lab.classList.add("ok"); t.textContent="helyes";}
      else if(!isA&&isS){lab.classList.add("bad"); t.textContent="rossz";}
      else if(isA&&!isS){lab.classList.add("miss"); t.textContent="ez is kellett";}
    });
    fb.className="fb show "+(ok?"good":"wrong");
    fb.innerHTML=`<span class="res">${ok?"Helyes.":"Nem pontos."}</span> ${q.ex}`;
    if(ok && !solved[q.id]){ solved[q.id]=1; save(); renderNav(currentId); }
  });
  el.querySelector(".rst").addEventListener("click",()=>{
    el.querySelectorAll("input").forEach(x=>x.checked=false);
    el.querySelectorAll(".opt").forEach(l=>{l.classList.remove("ok","bad","miss"); l.querySelector(".tag").textContent="";});
    fb.className="fb"; fb.innerHTML="";
  });
}

let drillState={score:0,total:0,cur:null};
function drillNext(){
  const el=document.getElementById("drill"); if(!el) return;
  const item=DR[Math.floor(Math.random()*DR.length)];
  const others=DR.filter(d=>d.a!==item.a).sort(()=>Math.random()-.5).slice(0,3).map(d=>d.a);
  const choices=[item.a,...others].sort(()=>Math.random()-.5);
  drillState.cur=item;
  el.innerHTML=`<div class="score">Eredmény: ${drillState.score} / ${drillState.total}</div>
   <div class="sym">${svg(230,62,item.s,"sm")}</div>
   <div class="grid">${choices.map(c=>`<button class="ch">${c}</button>`).join("")}</div>
   <div class="ex" aria-live="polite"></div>
   <div class="btnrow"><button class="btn" id="dnext">Következő</button></div>`;
  let answered=false;
  el.querySelectorAll(".ch").forEach(b=>b.addEventListener("click",()=>{
    if(answered) return; answered=true; drillState.total++;
    const ok=b.textContent===item.a; if(ok) drillState.score++;
    el.querySelectorAll(".ch").forEach(x=>{ if(x.textContent===item.a) x.classList.add("ok"); });
    if(!ok) b.classList.add("bad");
    el.querySelector(".score").textContent=`Eredmény: ${drillState.score} / ${drillState.total}`;
    el.querySelector(".ex").innerHTML=`<b>${ok?"Helyes.":"Nem ez."}</b> ${item.e}`;
  }));
  el.querySelector("#dnext").addEventListener("click",drillNext);
}

/* ---------- Chapter render ---------- */
let currentId=CH[0].id;
function show(id){
  const idx=Math.max(0,CH.findIndex(c=>c.id===id));
  const c=CH[idx]; currentId=c.id;
  let h=c.html;
  if(c.quiz.length){
    h+=`<section class="quiz"><h3>${c.quizTitle||"Ellenőrző kérdések"}</h3>${c.quiz.map(renderQ).join("")}</section>`;
  }
  const prev=CH[idx-1], next=CH[idx+1];
  h+=`<div class="pager">${prev?`<a class="btn ghost" href="#${prev.id}" style="text-decoration:none">Előző: ${prev.title}</a>`:'<span></span>'}${next?`<a class="btn" href="#${next.id}" style="text-decoration:none">Következő: ${next.title}</a>`:''}</div>`;
  const content=document.getElementById("content");
  content.innerHTML=h;
  content.querySelectorAll(".q[data-id]").forEach(el=>{ const q=c.quiz.find(x=>x.id===el.dataset.id); if(q) bindQ(el,q); });
  // tokens
  const exp=document.getElementById("tokexp");
  content.querySelectorAll(".tok").forEach(t=>t.addEventListener("click",()=>{
    content.querySelectorAll(".tok").forEach(x=>x.setAttribute("aria-pressed","false"));
    t.setAttribute("aria-pressed","true");
    if(exp) exp.textContent=t.dataset.e;
  }));
  // multiplicity explorer
  const mC=document.getElementById("multC");
  if(mC){
    const tC=document.getElementById("mC"), tO=document.getElementById("mO"), me=document.getElementById("multexp");
    mC.addEventListener("click",()=>{ tO.classList.add("hl"); tC.classList.remove("hl"); me.innerHTML="Nézd a <b>Customertől távolabbi</b> (Order felőli) véget: <b>0..*</b>. Egy vásárlónak nulla vagy több rendelése lehet."; });
    document.getElementById("multO").addEventListener("click",()=>{ tC.classList.add("hl"); tO.classList.remove("hl"); me.innerHTML="Nézd az <b>Ordertől távolabbi</b> (Customer felőli) véget: <b>1</b>. Minden rendelés pontosan egy vásárlóhoz tartozik."; });
  }
  if(c.id==="jeloles-gyakorlo") drillNext();
  renderNav(c.id);
  window.scrollTo(0,0);
}
function route(){ const h=(location.hash||"").replace("#",""); show(CH.some(c=>c.id===h)?h:CH[0].id); }
window.addEventListener("hashchange",route);
document.getElementById("reset").addEventListener("click",()=>{ solved={}; save(); route(); });
route();
})();
</script>
